name: CI/CD

on:
  workflow_call:
    inputs:
      publish:
        description: "Publish images to DockerHub and send the release Slack notification (set by the Combined workflow on master merge)."
        type: boolean
        default: false
      release_sha:
        description: "Commit SHA to reference in the notification (the merge commit on master)."
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          ## Alpine
          ### Alpine 3.23
          - image: "alpine/3.23/8.2/Dockerfile"
            tags: [ "spryker/php:latest", "spryker/php:8.2", "spryker/php:8.2-alpine3.23" ]
          - image: "alpine/3.23/8.3/Dockerfile"
            tags: [ "spryker/php:8.3", "spryker/php:8.3-alpine3.23" ]
          - image: "alpine/3.23/8.4/Dockerfile"
            tags: [ "spryker/php:8.4", "spryker/php:8.4-alpine3.23" ]

          ### Alpine 3.24
          - image: "alpine/3.24/8.2/Dockerfile"
            tags: [ "spryker/php:8.2-alpine3.24" ]
          - image: "alpine/3.24/8.3/Dockerfile"
            tags: [ "spryker/php:8.3-alpine3.24" ]
          - image: "alpine/3.24/8.4/Dockerfile"
            tags: [ "spryker/php:8.4-alpine3.24" ]
          - image: "alpine/3.24/8.5/Dockerfile"
            tags: [ "spryker/php:8.5", "spryker/php:8.5-alpine3.24" ]

          ## Debian
          ### Debian bookworm
          - image: "debian/bookworm/8.2/Dockerfile"
            tags: [ "spryker/php:8.2-debian" ]
          - image: "debian/bookworm/8.3/Dockerfile"
            tags: [ "spryker/php:8.3-debian" ]
          - image: "debian/bookworm/8.4/Dockerfile"
            tags: [ "spryker/php:8.4-debian" ]
          - image: "debian/bookworm/8.5/Dockerfile"
            tags: [ "spryker/php:8.5-debian" ]

    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: ${{ matrix.image }}
      tags: ${{ toJSON(matrix.tags) }}
      publish: ${{ inputs.publish || github.ref == 'refs/heads/master' }}
      release_sha: ${{ inputs.release_sha }}

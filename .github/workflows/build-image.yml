name: Build image

on:
  workflow_call:
    inputs:
      image:
        description: "Dockerfile path, e.g. alpine/3.24/8.2/Dockerfile."
        type: string
        required: true
      tags:
        description: "JSON array of image tags; the first one is the primary tag."
        type: string
        required: true
      publish:
        description: "Push the multi-arch image to DockerHub and send the release Slack notification."
        type: boolean
        default: false
      release_sha:
        description: "Commit SHA to reference in the notification (the merge commit on master)."
        type: string
        default: ""

env:
  IMAGE_REPO: spryker/php

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Resolve image key
        id: key
        env:
          IMAGE: ${{ inputs.image }}
        run: echo "key=$(dirname "$IMAGE" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          file: ${{ inputs.image }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_REPO }},push-by-digest=true,name-canonical=true,push=${{ inputs.publish }}

      - name: Export digest
        if: inputs.publish
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected digest '$DIGEST'"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"

      - name: Upload digest
        if: inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.key.outputs.key }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: publish
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ${{ inputs.image }}
      TAGS_JSON: ${{ inputs.tags }}
      PRIMARY_TAG: ${{ fromJSON(inputs.tags)[0] }}
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Detect previous image and set PREV_COMMIT_HASH
        id: previous_commit
        run: |
          PREV_COMMIT_HASH=$(git rev-parse --verify HEAD^1)
          HAS_PREVIOUS=false
          if docker buildx imagetools inspect "$PRIMARY_TAG" >/dev/null 2>&1; then HAS_PREVIOUS=true; fi
          {
            echo "IMAGE_KEY=$(dirname "$IMAGE" | tr '/' '-')"
            echo "PREV_COMMIT_HASH=$PREV_COMMIT_HASH"
            echo "HAS_PREVIOUS=$HAS_PREVIOUS"
          } >> "$GITHUB_ENV"

      - name: Re-tag images with previous commit hash
        if: env.HAS_PREVIOUS == 'true'
        run: |
          set -euo pipefail
          for IMAGE_TAG in $(jq -r '.[]' <<<"$TAGS_JSON"); do
            NEW_TAG="${IMAGE_TAG}-${PREV_COMMIT_HASH}"
            if ! docker buildx imagetools inspect "$IMAGE_TAG" >/dev/null 2>&1; then
              echo "$IMAGE_TAG is not published yet. Skipping retagging."
              continue
            fi
            # On a re-run the tag may already point to the new image, so keep the existing backup.
            if docker buildx imagetools inspect "$NEW_TAG" >/dev/null 2>&1; then
              echo "$NEW_TAG already exists. Skipping retagging."
              continue
            fi
            docker buildx imagetools create -t "$NEW_TAG" "$IMAGE_TAG"
            echo "Re-tagged image: $NEW_TAG"
          done

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ env.IMAGE_KEY }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          for ARCH in amd64 arm64; do
            if [ ! -s "$ARCH" ]; then
              echo "::error::Missing $ARCH digest"
              exit 1
            fi
          done
          TAG_ARGS=()
          for IMAGE_TAG in $(jq -r '.[]' <<<"$TAGS_JSON"); do TAG_ARGS+=(-t "$IMAGE_TAG"); done
          docker buildx imagetools create "${TAG_ARGS[@]}" "$IMAGE_REPO@$(cat amd64)" "$IMAGE_REPO@$(cat arm64)"
          docker buildx imagetools inspect "$PRIMARY_TAG"

      - name: Pull image for master branch
        run: |
          echo "Pulling image for master branch"
          docker pull "$PRIMARY_TAG"

      - name: Current image report
        id: manifest
        run: |
          bash .github/compare-images.sh "$PRIMARY_TAG" > current-image-report.txt || true
          cat current-image-report.txt

      - name: Previous image report
        if: env.HAS_PREVIOUS == 'true'
        run: |
          bash .github/compare-images.sh "${PRIMARY_TAG}-${PREV_COMMIT_HASH}" > previous-image-report.txt || true
          cat previous-image-report.txt

      - name: Run the diff and format output
        id: diff
        if: env.HAS_PREVIOUS == 'true'
        run: bash .github/format-output.sh

      - name: Determine change status
        id: change_status
        run: |
          if [ -n "${FORMATTED_DIFF}" ]; then
            echo "CHANGE_NOTE=:white_check_mark: Image content changed since the previous release." >> "$GITHUB_ENV"
          else
            echo "CHANGE_NOTE=:information_source: No content changes detected since the previous release." >> "$GITHUB_ENV"
          fi

      - name: Fetch Job ID
        id: fetch_job_id
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$CHECK_RUN_ID" ]; then
            JOB=$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$CHECK_RUN_ID")
          else
            JOB=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              | jq -c --arg image "$IMAGE" \
                '[.[].jobs[] | select((.name | contains($image + " / ")) and (.name | endswith(" / publish")))][0]')
          fi
          JOB_ID=$(jq -r '.id' <<<"$JOB")
          MANIFEST_STEP=$(jq -r '.steps[] | select(.name=="Current image report") | .number' <<<"$JOB")
          DIFF_STEP=$(jq -r '.steps[] | select(.name=="Run the diff and format output") | .number' <<<"$JOB")
          echo "Extracted Job ID: $JOB_ID (manifest step $MANIFEST_STEP, diff step $DIFF_STEP)"
          {
            echo "job_id=$JOB_ID"
            echo "manifest_step=$MANIFEST_STEP"
            echo "diff_step=$DIFF_STEP"
          } >> "$GITHUB_OUTPUT"

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "good",
                  "fields": [
                    {
                      "title": "New version of ${{ env.PRIMARY_TAG }} has been published",
                      "value": "${{ env.CHANGE_NOTE }}\n\nYou can check the:\n- *Manifest*: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ steps.fetch_job_id.outputs.job_id }}#step:${{ steps.fetch_job_id.outputs.manifest_step }}:1|View Manifest>\n- *Diff*: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ steps.fetch_job_id.outputs.job_id }}#step:${{ steps.fetch_job_id.outputs.diff_step }}:1|View Diff>\n\nThis version was built out of <https://github.com/${{ github.repository }}/commit/${{ env.RELEASE_SHA }}|${{ env.RELEASE_SHA }}>.",
                      "short": false
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CE_RELEASE_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
